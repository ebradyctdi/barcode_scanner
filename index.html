<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Barcode Scanner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #00d4ff;
    }

    .subtitle {
      color: #888;
      margin-bottom: 2rem;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .btn {
      background: #16213e;
      border: 2px solid #00d4ff;
      color: #00d4ff;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      display: inline-block;
    }

    .btn:hover {
      background: #00d4ff;
      color: #1a1a2e;
    }

    #fileInput, #cameraInput {
      display: none;
    }

    .preview-container {
      position: relative;
      max-width: 100%;
      margin-bottom: 2rem;
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .preview-container.visible {
      display: block;
    }

    .preview-container canvas {
      max-width: 100%;
      max-height: 60vh;
      display: block;
      border-radius: 12px;
    }

    .status {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 1rem;
      text-align: center;
      min-height: 1.5rem;
    }

    .status.loading {
      color: #ffd700;
    }

    .status.error {
      color: #ff4444;
    }

    .status.success {
      color: #00ff88;
    }

    .results {
      width: 100%;
      max-width: 700px;
    }

    .results h2 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      color: #00d4ff;
    }

    .barcode-card {
      background: #16213e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      transition: border-color 0.2s;
    }

    .barcode-card:hover {
      border-color: #00d4ff;
    }

    .barcode-format {
      font-size: 0.8rem;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .barcode-value {
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      word-break: break-all;
      color: #fff;
    }

    .barcode-copy {
      margin-top: 0.5rem;
      background: none;
      border: 1px solid #555;
      color: #aaa;
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .barcode-copy:hover {
      border-color: #00d4ff;
      color: #00d4ff;
    }

    .no-results {
      color: #666;
      text-align: center;
      padding: 2rem;
    }

    .note {
      color: #666;
      font-size: 0.85rem;
      margin-top: 2rem;
      text-align: center;
      max-width: 500px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.4rem; }
      .controls { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <h1>Multi-Barcode Scanner</h1>
  <p class="subtitle">Upload or take a photo containing barcodes. All detected codes will be listed below.</p>

  <div class="controls">
    <label class="btn" for="fileInput">&#128193; Upload Image</label>
    <input type="file" id="fileInput" accept="image/*">
    <label class="btn" for="cameraInput">&#128247; Take Photo</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
  </div>

  <div class="status" id="status"></div>

  <div class="preview-container" id="previewContainer">
    <canvas id="canvas"></canvas>
  </div>

  <div class="results" id="results"></div>

  <p class="note">This page must be served over HTTP/HTTPS (e.g. GitHub Pages or a local server). It will not work when opened directly as a file.</p>

  <script type="module">
    const fileInput = document.getElementById("fileInput");
    const cameraInput = document.getElementById("cameraInput");
    const statusEl = document.getElementById("status");
    const previewContainer = document.getElementById("previewContainer");
    const canvas = document.getElementById("canvas");
    const resultsDiv = document.getElementById("results");
    const ctx = canvas.getContext("2d");

    let readBarcodes = null;

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = "status " + (type || "");
    }

    // Load the library on page init
    async function initLibrary() {
      setStatus("Loading barcode library...", "loading");
      try {
        const module = await import("https://esm.sh/zxing-wasm@1/reader");
        readBarcodes = module.readBarcodes;
        setStatus("Ready. Upload or take a photo.", "");
      } catch (err) {
        console.error("Failed to load zxing-wasm:", err);
        setStatus(
          "Failed to load barcode library. Make sure this page is served over HTTP/HTTPS.",
          "error"
        );
      }
    }

    async function processImage(file) {
      if (!file) return;
      if (!readBarcodes) {
        setStatus("Library not loaded yet. Please wait or reload.", "error");
        return;
      }

      setStatus("Loading image...", "loading");
      resultsDiv.innerHTML = "";

      const img = new Image();
      const url = URL.createObjectURL(file);

      img.onload = async () => {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        ctx.drawImage(img, 0, 0);
        previewContainer.classList.add("visible");
        URL.revokeObjectURL(url);

        setStatus("Scanning for barcodes...", "loading");

        try {
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

          const results = await readBarcodes(imageData, {
            tryHarder: true,
            formats: [],
            maxNumberOfSymbols: 100,
          });

          if (results.length === 0) {
            setStatus("No barcodes found. Try a clearer or larger image.", "error");
            resultsDiv.innerHTML = '<p class="no-results">No barcodes detected in this image.</p>';
            return;
          }

          setStatus(
            "Found " + results.length + " barcode" + (results.length > 1 ? "s" : "") + "!",
            "success"
          );
          displayResults(results);
          drawOverlays(results);
        } catch (err) {
          console.error("Scan error:", err);
          setStatus("Error scanning image: " + err.message, "error");
        }
      };

      img.onerror = () => {
        setStatus("Failed to load image.", "error");
        URL.revokeObjectURL(url);
      };

      img.src = url;
    }

    function displayResults(results) {
      let html = "<h2>Detected Barcodes (" + results.length + ")</h2>";

      results.forEach((result) => {
        const format = result.format || "Unknown";
        const value = result.text || "";
        html += '<div class="barcode-card">';
        html += '<div class="barcode-format">' + escapeHtml(format) + "</div>";
        html += '<div class="barcode-value">' + escapeHtml(value) + "</div>";
        html += '<button class="barcode-copy" data-value="' + escapeAttr(value) + '">Copy</button>';
        html += "</div>";
      });

      resultsDiv.innerHTML = html;

      resultsDiv.querySelectorAll(".barcode-copy").forEach((btn) => {
        btn.addEventListener("click", () => {
          navigator.clipboard.writeText(btn.dataset.value).then(() => {
            btn.textContent = "Copied!";
            setTimeout(() => { btn.textContent = "Copy"; }, 1500);
          });
        });
      });
    }

    function drawOverlays(results) {
      ctx.lineWidth = Math.max(3, canvas.width / 200);
      const fontSize = Math.max(16, canvas.width / 40);
      ctx.font = "bold " + fontSize + "px sans-serif";

      results.forEach((result, i) => {
        const pos = result.position;
        if (!pos) return;

        const points = [pos.topLeft, pos.topRight, pos.bottomRight, pos.bottomLeft];
        if (!points[0]) return;

        // Draw bounding polygon
        ctx.strokeStyle = "#00ff88";
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let j = 1; j < points.length; j++) {
          ctx.lineTo(points[j].x, points[j].y);
        }
        ctx.closePath();
        ctx.stroke();

        // Draw label
        const labelX = points[0].x;
        const labelY = points[0].y - 8;
        const text = "#" + (i + 1) + ": " + result.text;
        const metrics = ctx.measureText(text);
        const padding = 4;
        ctx.fillStyle = "rgba(0, 212, 255, 0.85)";
        ctx.fillRect(
          labelX - padding,
          labelY - fontSize - padding,
          metrics.width + padding * 2,
          fontSize + padding * 2
        );
        ctx.fillStyle = "#000";
        ctx.fillText(text, labelX, labelY);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    fileInput.addEventListener("change", (e) => {
      processImage(e.target.files[0]);
      e.target.value = "";
    });
    cameraInput.addEventListener("change", (e) => {
      processImage(e.target.files[0]);
      e.target.value = "";
    });

    // Init on load
    initLibrary();
  </script>
</body>
</html>
